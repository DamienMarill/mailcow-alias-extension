# Publishes a GitHub release with the Chrome and Firefox zips when the version
# in package.json changes on main (`npm version patch|minor|major`), once CI
# is green on that commit.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Pushes to main only: CI also runs for pull requests.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - name: Read version
        id: version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.version.outputs.exists != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build and package
        if: steps.version.outputs.exists != 'true'
        run: |
          npm ci
          npm run zip

      - name: Create tag and release
        if: steps.version.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" release/*.zip \
            --target "$SHA" \
            --title "$TAG" \
            --generate-notes
