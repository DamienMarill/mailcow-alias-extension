# Publishes a GitHub release with the Chrome and Firefox zips each time the
# version in package.json changes on main (`npm version patch|minor|major`).
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.version.outputs.exists != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build and package
        if: steps.version.outputs.exists != 'true'
        run: |
          npm ci
          npm run check
          npm test
          npm run zip
          npx web-ext lint --source-dir dist/firefox --warnings-as-errors

      - name: Create tag and release
        if: steps.version.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" release/*.zip \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
