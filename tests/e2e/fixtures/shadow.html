<!doctype html>
<html lang="fr">
<body>
    <x-signup></x-signup>
    <script>
        customElements.define('x-signup', class extends HTMLElement {
            constructor() {
                super()
                const root = this.attachShadow({ mode: 'closed' })
                root.innerHTML = '<input type="email" id="email"><input type="password">'
                window.readShadowEmail = () => root.getElementById('email').value
            }
        })
    </script>
</body>
</html>
